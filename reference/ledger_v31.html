<html lang="my">
<head>

<title>2D Ledger — Commission Entry</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#172235;--muted:#718096;--line:#e5eaf2;--navy:#111c2e;--blue:#3267e9;--green:#159b69;--orange:#d88922;--red:#d94c55}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Noto Sans Myanmar",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:1100px;margin:auto;min-height:100vh}header{background:var(--navy);color:#fff;padding:17px 22px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:11px;align-items:center}.logo{height:40px;width:40px;border-radius:13px;background:var(--blue);display:grid;place-items:center;font-weight:900}.brand h1{font-size:17px;margin:0}.brand small{color:#aebbd0;font-size:11px}.role{font-size:12px;color:#dce7f8;background:#263750;padding:7px 10px;border-radius:25px}
main{padding:22px}.intro{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.intro h2{font-size:23px;margin:0}.intro p{margin:4px 0 0;color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:17px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.stat label{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:24px;margin-top:5px}.tabs{display:flex;gap:7px;background:#e9eef6;padding:5px;border-radius:13px;margin-bottom:16px}.tab{padding:9px 14px;background:transparent;color:#536176;border-radius:9px;font-weight:650}.tab.active{background:white;color:#1c2b43}.btn{padding:10px 14px;border-radius:10px;background:var(--blue);color:white;font-weight:700}.btn.secondary{background:#edf2ff;color:#2858ce}.btn.ghost{background:#f1f4f8;color:#46546a}.btn.danger{background:#fff0f0;color:var(--red)}.btn.small{font-size:12px;padding:8px 11px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.panel h3{font-size:16px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:650;background:#fafbfd}.money{font-variant-numeric:tabular-nums;font-weight:700}.pill{display:inline-block;border-radius:25px;padding:4px 8px;background:#edf2ff;color:#315dc5;font-size:11px}.empty{text-align:center;padding:25px;color:var(--muted);font-size:13px}
.formrow{display:flex;gap:10px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:130px;margin-bottom:11px}.field label{font-size:12px;color:#5e6b7e;font-weight:650}.field input,.field textarea{width:100%;border:1px solid #dce3ed;border-radius:10px;padding:11px;background:#fff;color:#111827;outline:none}input,textarea,select{color:#111827}input::placeholder,textarea::placeholder{color:#6b7280;opacity:1}.field textarea{min-height:92px;resize:vertical;font-family:ui-monospace,monospace}.field input:focus,.field textarea:focus{border-color:#7295f4;box-shadow:0 0 0 3px #3267e91a}
.user-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.avatar{height:40px;width:40px;border-radius:13px;background:#eaf0ff;color:#315dc5;display:grid;place-items:center;font-weight:800}.user-info{flex:1;min-width:0}.user-info b{display:block}.user-info small{color:var(--muted);font-size:11px}.user-actions{display:flex;gap:6px}
.modal-back{position:fixed;inset:0;background:#10182788;display:grid;place-items:center;padding:14px;z-index:10}.modal{background:white;width:min(650px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:20px;box-shadow:0 20px 60px #0003}.modal h3{margin:0 0 4px}.close-row{display:flex;justify-content:space-between;align-items:start;margin-bottom:16px}.close{background:#f0f3f8;border-radius:9px;padding:6px 10px;font-size:18px}.modebar{display:flex;gap:7px;background:#eef2f8;border-radius:11px;padding:4px;margin:13px 0}.modebar button{flex:1;background:transparent;border-radius:8px;padding:9px;color:#56647a;font-size:13px;font-weight:650}.modebar button.active{background:#fff;color:#2456cf;box-shadow:0 2px 6px #17223512}.preview{background:#f7f9fc;border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}.preview table{min-width:0}.preview th,.preview td{padding:7px}.total{display:flex;justify-content:space-between;align-items:center;font-weight:750;padding-top:10px}.hint{font-size:12px;color:#68768a;background:#f4f7fc;border-radius:10px;padding:10px;margin:10px 0}.error{color:var(--red);font-size:12px;margin:7px 0}.success{color:var(--green);font-size:12px}.bottom{display:none}
@media(max-width:700px){main{padding:15px 13px 30px}header{padding:13px 15px}.intro h2{font-size:20px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:20px}.tabs{overflow:auto}.tab{white-space:nowrap;padding:9px 11px;font-size:12px}.user-row{align-items:flex-start}.user-actions{flex-direction:column}.user-actions .btn{white-space:nowrap}.modal{padding:16px}.bottom{display:block}}
.field select{width:100%;border:1px solid #dce3ed;border-radius:10px;padding:11px;background:#fff;color:#111827;outline:none}.field select:focus{border-color:#7295f4;box-shadow:0 0 0 3px #3267e91a}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="logo">2D</div><div><h1>2D LEDGER</h1><small>Commission & Number Ledger</small></div></div><span class="role">ADMIN MODE · DEMO</span></header>
<main>
<div class="intro"><div><h2 id="title">Commission Users</h2><p id="desc">User တစ်ယောက်ချင်းစီရဲ့ ဘေးက ထိုးရန်ကို နှိပ်ပြီး စာရင်းသွင်းပါ</p></div><div class="formrow" style="justify-content:flex-end;flex:0 0 auto"><button class="btn secondary" onclick="openDrawResults()">ထွက်ဂဏန်း</button><button class="btn secondary" onclick="openGlobalBlocked()">မရဂဏန်း</button><button class="btn" onclick="openAddUser()">＋ User အသစ်</button></div></div>
<div class="stats" id="stats"></div>
<div class="tabs"><button class="tab active" id="tabUsers" onclick="showTab('users')">Commission Users</button><button class="tab" id="tabBets" onclick="showTab('bets')">တင်စာရင်းအားလုံး</button><button class="tab" id="tabNumbers" onclick="showTab('numbers')">Numbers 00–99</button><button class="tab" id="tabCover" onclick="showTab('cover')">ကာဂဏန်းထုတ်ရန်</button><button class="tab" id="tabHistory" onclick="showTab('history')">မှတ်တမ်းများ</button></div>
<section id="usersPanel" class="panel"></section>
<section id="betsPanel" class="panel" hidden></section>
<section id="numbersPanel" class="panel" hidden></section>
<section id="coverPanel" class="panel" hidden></section>
<section id="historyPanel" class="panel" hidden></section>
</main>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const STORE='ledgerCommissionFormatV2';
const initial={users:[{id:'u1',name:'ကိုအောင်',username:'aung',commissionPercent:10},{id:'u2',name:'မမေ',username:'may',commissionPercent:10}],entries:[],drawResults:[]};
let db;try{db=JSON.parse(localStorage.getItem(STORE))||initial}catch(e){db=initial}
db.drawResults=db.drawResults||[];db.blockedNumbers=db.blockedNumbers||[];db.coverVouchers=db.coverVouchers||[];db.finalizedRecords=db.finalizedRecords||[];db.users.forEach(u=>{if(u.commissionPercent===undefined)u.commissionPercent=10;if(u.odd===undefined)u.odd=80});
let currentUserId=null,entryMode='format',parsedRows=[];
const fmt=n=>Number(n||0).toLocaleString('en-US');
const save=()=>localStorage.setItem(STORE,JSON.stringify(db));
const userName=id=>db.users.find(u=>u.id===id)?.name||'Unknown';
const drawNum=x=>String(x.number||x.morning||x.evening||'');
const drawSess=x=>x.session||(x.morning?'morning':x.evening?'evening':'');
const sessLabel=v=>v==='morning'?'မနက်':v==='evening'?'ညနေ':'—';
const defaultSession=()=>{const n=new Date();return (n.getHours()*60+n.getMinutes())<13*60?'morning':'evening'};
// latest draw first: newest date, and on the same date evening before morning
const sortDraws=()=>[...(db.drawResults||[])].filter(x=>drawNum(x)).sort((a,b)=>b.date.localeCompare(a.date)||((drawSess(b)==='evening'?1:0)-(drawSess(a)==='evening'?1:0)));
function toast(s){const root=document.getElementById('toastRoot');root.innerHTML=`<div style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#172235;color:white;padding:11px 16px;border-radius:11px;z-index:30;font-size:13px">${s}</div>`;setTimeout(()=>root.innerHTML='',2200)}
function userEntries(id){return db.entries.filter(e=>e.userId===id)}
function sumEntries(es){return es.reduce((s,e)=>s+(Array.isArray(e.lines)?e.lines.reduce((t,x)=>t+Number(x.amount||0),0):Number(e.amount||0)),0)}
function stats(){let all=db.entries;document.getElementById('stats').innerHTML=`<div class="stat"><label>Commission Users</label><strong>${db.users.length}</strong></div><div class="stat"><label>ဘောင်ချာ / Entry</label><strong>${all.length}</strong></div><div class="stat"><label>စုစုပေါင်းတင်ငွေ</label><strong>${fmt(sumEntries(all))}</strong></div>`}
function showTab(tab){['users','bets','numbers','cover','history'].forEach(x=>{document.getElementById(x+'Panel').hidden=x!==tab;document.getElementById('tab'+x[0].toUpperCase()+x.slice(1)).classList.toggle('active',x===tab)});document.getElementById('title').textContent=tab==='users'?'Commission Users':tab==='bets'?'တင်စာရင်းအားလုံး':tab==='numbers'?'Numbers 00–99':tab==='cover'?'ကာဂဏန်းထုတ်ရန်':'မှတ်တမ်းများ';document.getElementById('desc').textContent=tab==='users'?'User တစ်ယောက်ချင်းစီရဲ့ ဘေးက ထိုးရန်ကို နှိပ်ပြီး စာရင်းသွင်းပါ':tab==='bets'?'User အလိုက် ထည့်သွင်းထားသော စာရင်းများ':tab==='numbers'?'ဂဏန်းတစ်ကွက်ချင်းစီ၏ စုစုပေါင်းတင်ငွေ':tab==='cover'?'00 မှ 99 အထိ ရှိပြီးသားတင်ငွေထဲမှ ပမာဏကို အလိုအလျောက် ကာပါ':'အပြီးစာရင်းချုပ်ထားသော ရလဒ်များ';render()}
function render(){stats();renderUsers();renderBets();renderNumbers();renderCover();renderHistory()}
function renderUsers(){let root=document.getElementById('usersPanel');root.innerHTML=`<div class="panel-head"><div><h3>Commission User စာရင်း</h3><div class="sub">ထိုးရန် button ကို နှိပ်ပြီး User တစ်ယောက်ချင်းစီအတွက် ဂဏန်းထည့်ပါ</div></div></div>`+(db.users.length?db.users.map(u=>{let es=userEntries(u.id);return `<div class="user-row"><div class="avatar">${u.name.slice(0,1)}</div><div class="user-info"><b>${esc(u.name)}</b><small>@${esc(u.username)} · Commission ${fmt(u.commissionPercent)}% · The Odd ${fmt(u.odd)}x · ${es.length} ကြိမ် · ပေးငွေ ${u.payment==null||u.payment===''?'—':fmt(u.payment)+' ကျပ်'} · စုစုပေါင်း ${fmt(sumEntries(es))} ကျပ်</small></div><div class="user-actions"><button class="btn small" onclick="openBet('${u.id}')">＋ ထိုးရန်</button><button class="btn small secondary" onclick="viewUser('${u.id}')">စာရင်းကြည့်</button><button class="btn small ghost" onclick="openSettlement('${u.id}')">စာရင်းတွက်မည်</button><button class="btn small secondary" onclick="editUser('${u.id}')">Edit</button><button class="btn small danger" onclick="deleteUser('${u.id}')">Delete</button></div></div>`}).join(''):'<div class="empty">User မရှိသေးပါ။ User အသစ်ထည့်ပါ။</div>')+`<div style="display:flex;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)"><button class="btn" onclick="openFinalizeConfirm()">အပြီးစာရင်းချုပ်မည်</button></div>`}
function renderBets(){let es=[...db.entries].sort((a,b)=>b.created.localeCompare(a.created));document.getElementById('betsPanel').innerHTML=`<div class="panel-head"><div><h3>တင်စာရင်းအားလုံး</h3><div class="sub">Format နှင့် တစ်လုံးချင်းထည့်ထားသော မှတ်တမ်းများ</div></div><span class="pill">${es.length} records</span></div>`+entryTable(es,false)}
function numberBalances(){
  // Gross stake comes from user vouchers. "စားငွ" is the amount allocated/eaten
  // by saved cover actions. "ကာငွ" is ONLY the latest saved cover voucher list;
  // without a saved cover voucher, cover must be zero (not gross minus eaten).
  const gross=Object.create(null), eaten=Object.create(null), cover=Object.create(null);
  const norm=n=>String(n??'').trim().padStart(2,'0');
  db.entries.forEach(e=>(e.lines||[]).forEach(x=>{const n=norm(x.num);if(/^\d{2}$/.test(n))gross[n]=(gross[n]||0)+Math.max(0,Number(x.amount)||0)}));
  (db.coverVouchers||[]).forEach(v=>{
    (v.allocations||[]).forEach(x=>{const n=norm(x.num);if(/^\d{2}$/.test(n))eaten[n]=(eaten[n]||0)+Math.max(0,Number(x.amount)||0)});
  });
  const vouchers=[...(db.coverVouchers||[])].sort((a,b)=>String(a.created||'').localeCompare(String(b.created||'')));
  const latest=vouchers.length?vouchers[vouchers.length-1]:null;
  if(latest){
    (latest.remainingLines||[]).forEach(x=>{const n=norm(x.num);if(/^\d{2}$/.test(n))cover[n]=(cover[n]||0)+Math.max(0,Number(x.amount)||0)});
  }
  const out={};
  for(let i=0;i<100;i++){
    const n=String(i).padStart(2,'0'),g=gross[n]||0,e=eaten[n]||0,c=cover[n]||0;
    // Before the first cover voucher, the original stake is available to cover.
    // After a voucher exists, only its latest remaining cover-list value is available.
    out[n]={gross:g,covered:e,cover:c,remaining:latest?c:g};
  }
  return out;
}
function renderNumbers(){
 let map=numberBalances(),rows=Array.from({length:100},(_,i)=>String(i).padStart(2,'0'));
 let latestDraw=sortDraws()[0];
 let winning=latestDraw?drawNum(latestDraw).padStart(2,'0'):'';
 let totalGross=0,totalEaten=0,totalCover=0;
 Object.values(map).forEach(x=>{totalGross+=x.gross;totalEaten+=x.covered;totalCover+=x.cover});
  const activeCount=rows.filter(n=>map[n].gross>0).length; // active = stake not 0
 const winBalance=winning?map[winning]:{gross:0,covered:0,cover:0,remaining:0};
 // Per-user winning stakes determine the weighted average Odd and the
 // average commission percentage among users who actually hit the draw.
 const winUsers=[];
 if(winning){
   db.users.forEach(u=>{
     const stake=db.entries.filter(e=>e.userId===u.id).flatMap(e=>e.lines||[])
       .filter(x=>String(x.num).padStart(2,'0')===winning)
       .reduce((sum,x)=>sum+Math.max(0,Number(x.amount)||0),0);
     if(stake>0)winUsers.push({stake,odd:Number(u.odd??80),commission:Number(u.commissionPercent||0)});
   });
 }
 const winUserStake=winUsers.reduce((a,x)=>a+x.stake,0);
 const avgOdd=winUserStake?winUsers.reduce((a,x)=>a+x.stake*x.odd,0)/winUserStake:0;
 const avgWinnerCommission=winUsers.length?winUsers.reduce((a,x)=>a+x.commission,0)/winUsers.length:0;
 // Keep the settlement formulas as specified: dealer cover deducts 13%
 // and the Odd payout against eaten winning stake; own eaten deducts the
 // winning-users' average commission and Odd payout against covered stake.
 const yourEaten=totalEaten-(avgWinnerCommission/100*totalEaten)-(avgOdd*winBalance.covered);
 const otherDealerCover=totalCover-(totalCover*0.13)-(avgOdd*winBalance.cover);

 document.getElementById('numbersPanel').innerHTML=`<div class="panel-head"><div><h3>ဂဏန်း 00–99</h3><div class="sub">တင်ငွ၊ ကာဘောင်ချာထုတ်ရာမှ စားငွနှင့် နောက်ဆုံးသိမ်းထားသော ကာဘောင်ချာစာရင်းထဲရှိ ကာငွကို သီးခြားပြထားပါသည်။</div></div></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px;margin:0 0 12px"><div class="stat"><label>Active ဂဏန်း</label><strong>${activeCount} / 100</strong><small>တင်ငွေ 0 မဟုတ်သော ဂဏန်းအရေအတွက်</small></div></div>
 <div class="table-wrap"><table><thead><tr><th>ဂဏန်း</th><th>စုစုပေါင်းတင်ငွ</th><th>ဘောင်ချာထုတ်ပြီး စားငွ</th><th>ကာငွ (ကာဘောင်ချာ)</th></tr></thead><tbody>${rows.map(n=>{let x=map[n],isWin=n===winning;return `<tr${isWin?' style="background:#fff0f0"':''}><td><b${isWin?' style="color:#d94c55;font-size:16px"':''}>${n}</b>${isWin?' <span style="color:#d94c55;font-size:11px;font-weight:700">ထွက်ဂဏန်း</span>':''}</td><td class="money">${fmt(x.gross)} ကျပ်</td><td>${fmt(x.covered)} ကျပ်</td><td class="money">${fmt(x.cover)} ကျပ်</td></tr>`}).join('')}</tbody><tfoot><tr style="background:#f3f6fb;font-weight:800"><td>စုစုပေါင်း</td><td class="money">${fmt(totalGross)} ကျပ်</td><td class="money">${fmt(totalEaten)} ကျပ်</td><td class="money">${fmt(totalCover)} ကျပ်</td></tr></tfoot></table></div>
 <div class="preview" style="margin-top:14px"><b>ထွက်ဂဏန်းနှင့် စာရင်းချုပ်</b>${winning?`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px;margin-top:10px"><div class="stat"><label>ထွက်ဂဏန်း၏ တင်ငွ (${winning})</label><strong>${fmt(winBalance.gross)}</strong><small>ကျပ်</small></div><div class="stat"><label>သင်၏စားငွေ</label><strong style="color:${yourEaten>=0?'var(--green)':'var(--red)'}">${fmt(yourEaten)}</strong><small>ကျပ်</small></div><div class="stat"><label>တခြားဒိုင်ကာငွေ</label><strong style="color:${otherDealerCover>0?'var(--red)':'var(--green)'}">${fmt(Math.abs(otherDealerCover))}</strong><small>ကျပ်</small><small>${otherDealerCover>0?"ဒိုင်ကိုပေးရန်":"ဒိုင်စီမှရရန်"}</small></div></div><div class="hint" style="margin-top:10px">တွက်ချက်ရာတွင် ပေါက်သူများ၏ ပျမ်းမျှ Commission ${fmt(avgWinnerCommission)}% နှင့် ပေါက်သူများ၏ တင်ငွအလိုက် အလေးပေးတွက်ထားသော The Odd ${fmt(avgOdd)}x ကို အသုံးပြုထားပါသည်။</div>`:'<div class="hint" style="margin-top:10px">ထွက်ဂဏန်း မရှိသေးပါ။ ထွက်ဂဏန်းထည့်ပြီးမှ ထွက်ဂဏန်း၏ တင်ငွ၊ သင်၏စားငွနှင့် တခြားဒိုင်ကာငွကို ပြသပါမည်။</div>'}</div>`;
}
function renderCover(){
  let root=document.getElementById('coverPanel');if(!root)return;
  let map=numberBalances(),gross=0,covered=0,remaining=0;
  Object.values(map).forEach(x=>{gross+=x.gross;covered+=x.covered;remaining+=x.remaining});
  const totalEatenSaved=(db.coverVouchers||[]).reduce((sum,v)=>sum+(v.allocations||[]).reduce((a,x)=>a+Math.max(0,Number(x.amount)||0),0),0);
  // Sum each saved voucher's own cover-list total.
  // Each voucher is an individual receipt; the dashboard total adds them together.
  const voucherCoverTotal=(db.coverVouchers||[]).reduce((grand,v)=>grand+(v.remainingLines||[]).reduce((sum,line)=>sum+Math.max(0,Number(line.amount)||0),0),0);
  let vouchers=[...db.coverVouchers].sort((a,b)=>b.created.localeCompare(a.created));
  let latest=window.showingCoverReceiptId?db.coverVouchers.find(v=>v.id===window.showingCoverReceiptId):null;

function buildCoverPlan(requested){
  let balances=numberBalances(),allocations=[];
  // The admin-entered amount is deducted from EACH number with a positive
  // original stake, limited to that number's remaining balance.
  for(let i=0;i<100;i++){
    const num=String(i).padStart(2,'0');
    const available=balances[num].remaining;
    if(balances[num].gross>0 && available>0){
      const take=Math.min(requested,available);
      if(take>0) allocations.push({num,amount:take});
    }
  }
  const actual=allocations.reduce((sum,x)=>sum+x.amount,0);
  return {balances,allocations,requested,actual,shortfall:0};
}

function parseFormat(raw){
  const bets=[], errors=[];
  const brotherSets={
    0:[0,19,28,37,46,55,64,73,82,91],1:[1,10,29,38,47,56,65,74,83,92],
    2:[2,11,20,39,48,57,66,75,84,93],3:[3,12,21,30,49,58,67,76,85,94],
    4:[4,13,22,31,40,59,68,77,86,95],5:[5,14,23,32,41,50,69,78,87,96],
    6:[6,15,24,33,42,51,60,79,88,97],7:[7,16,25,34,43,52,61,70,89,98],
    8:[8,17,26,35,44,53,62,71,80,99],9:[9,18,27,36,45,54,63,72,81,90]
  };
  const special={
    apu:[0,11,22,33,44,55,66,77,88,99],
    nyiko:[12,21,23,32,34,43,45,54,56,65,67,76,78,87,89,98,90,9,1,10],
    power:[5,16,27,38,49,50,61,72,83,94],
    natkat:[7,18,24,35,69,70,81,42,53,96]
  };
  const add=(num,amount)=>{ if(Number.isInteger(num)&&num>=0&&num<=99&&Number.isFinite(amount)&&amount>0) bets.push({num:String(num).padStart(2,'0'),amount}); };
  const addSpecial=(key,amount)=>special[key].forEach(n=>add(n,amount));
  const lines=String(raw||'').replace(/\r/g,'\n').split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean);
  for(const line of lines){
    let m, amount, nums;
    if((m=line.match(/^(Apu|Nyiko|Power|Natkat)\s+(\d+)$/i))){addSpecial(m[1].toLowerCase(),Number(m[2]));continue;}
    if((m=line.match(/^(\d{1,2})\s*(PP|TO|BO|BK)\s*-?\s*(\d+)$/i))){
      const digit=Number(m[1]), kind=m[2].toUpperCase(); amount=Number(m[3]);
      if(digit>9){errors.push('PP / TO / BO / BR တွင် 0 မှ 9 အထိ digit သာသုံးပါ: '+line);continue;}
      if(kind==='PP'){for(let i=0;i<10;i++){add(digit*10+i,amount);if(i!==digit)add(i*10+digit,amount)}}
      else if(kind==='TO'){for(let i=0;i<10;i++)add(digit*10+i,amount)}
      else if(kind==='BO'){for(let i=0;i<10;i++)add(i*10+digit,amount)}
      else brotherSets[digit].forEach(n=>add(n,amount));
      continue;
    }
    // Slash-separated numbers with dash amount, e.g. 11/22/33-1000 (no reverse)
    if((m=line.match(/^([\d/]+)\s*-\s*(\d+)$/))){
      amount=Number(m[2]);nums=m[1].split('/');
      if(nums.some(n=>!/^[0-9]{1,2}$/.test(n)||Number(n)>99)||amount<=0){errors.push('ဂဏန်း သို့မဟုတ် ငွေပမာဏ မမှန်ပါ: '+line);continue;}
      nums.forEach(n=>add(Number(n),amount));continue;
    }
    // Single number with dash amount, e.g. 00-5000 means number 00 gets 5000
    if((m=line.match(/^(\d{1,2})\s*-\s*(\d+)$/))){
      const num=Number(m[1]), amt=Number(m[2]);
      if(num<=99 && amt>0){add(num,amt);} else {errors.push('ဂဏန်း သို့မဟုတ် ငွေပမာဏ မမှန်ပါ: '+line);}
      continue;
    }
    // slash-separated numbers with R: add each number and its reverse
    if((m=line.match(/^([\d/]+)\s*-?\s*R\s*(\d+)$/i))){
      amount=Number(m[2]); nums=m[1].split('/');
      if(nums.some(n=>!/^\d{1,2}$/.test(n)||Number(n)>99)){errors.push('ဂဏန်း format မမှန်ပါ: '+line);continue;}
      nums.forEach(n=>{const v=Number(n);const r=Number(String(v).padStart(2,'0').split('').reverse().join(''));add(v,amount);if(r!==v)add(r,amount)});continue;
    }
    // slash-separated numbers without R: no reverse
    if((m=line.match(/^([\d/]+)\s+(\d+)$/))){
      amount=Number(m[2]);nums=m[1].split('/');
      if(nums.some(n=>!/^\d{1,2}$/.test(n)||Number(n)>99)){errors.push('ဂဏန်း format မမှန်ပါ: '+line);continue;}
      nums.forEach(n=>add(Number(n),amount));continue;
    }
    // equals-separated amount, e.g. 12/21=1000
    if((m=line.match(/^([\d/]+)\s*=\s*(\d+)$/))){
      amount=Number(m[2]);nums=m[1].split('/');
      if(nums.some(n=>!/^\d{1,2}$/.test(n)||Number(n)>99)){errors.push('ဂဏန်း format မမှန်ပါ: '+line);continue;}
      nums.forEach(n=>add(Number(n),amount));continue;
    }
    errors.push('Format မမှန်ပါ: '+line);
  }
  // Match merge_bets behavior: repeated occurrences of the same number are combined.
  const merged=new Map();
  bets.forEach(x=>merged.set(x.num,(merged.get(x.num)||0)+x.amount));
  return {result:[...merged].map(([num,amount])=>({num,amount})),errors};
}

function openGlobalBlocked(){modal(`<div class="close-row"><div><h3>မရဂဏန်း သတ်မှတ်ရန်</h3><div class="sub">ဒီနေရာမှာ သတ်မှတ်ထားတဲ့ မရဂဏန်းတွေကို User အားလုံးအတွက် အသုံးပြုပါမည်။</div></div><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>မရဂဏန်း (ကော်မာဖြင့်ခွဲပါ၊ 00 မှ 99)</label><input id="globalBlockedInput" value="${esc((db.blockedNumbers||[]).join(','))}" placeholder="ဥပမာ 12,34,56"></div><div class="hint">Format နဲ့ထိုးခြင်းနှင့် တစ်လုံးချင်းထိုးခြင်း နှစ်မျိုးလုံးတွင် ပိတ်ထားသောဂဏန်းများကို ထိုးမရပါ။</div><button class="btn" style="width:100%" onclick="saveGlobalBlocked()">မရဂဏန်း သိမ်းမယ်</button>`)}
function saveGlobalBlocked(){const raw=document.getElementById('globalBlockedInput').value,nums=parseBlockedNumbers(raw);if(raw.trim()&&nums.length===0){toast('မရဂဏန်းကို 00 မှ 99 အတွင်း မှန်ကန်စွာထည့်ပါ');return}db.blockedNumbers=nums;save();closeModal();render();toast('User အားလုံးအတွက် မရဂဏန်း သိမ်းပြီးပါပြီ')}
function renderHistory(){
 const root=document.getElementById('historyPanel');if(!root)return;
 const rows=[...(db.finalizedRecords||[])].sort((a,b)=>(b.date+b.session).localeCompare(a.date+a.session));
 root.innerHTML=`<div class="panel-head"><div><h3>အပြီးစာရင်းချုပ် မှတ်တမ်းများ</h3><div class="sub">ထွက်ဂဏန်းသိမ်းပြီး အပြီးစာရင်းချုပ်ထားသော မှတ်တမ်းများ</div></div></div>`+
 (rows.length?`<div class="table-wrap"><table><thead><tr><th>ရက်စွဲ</th><th>ထွက်ဂဏန်းအချိန်</th><th>ထွက်ဂဏန်း</th><th>User</th><th>စုစုပေါင်းတင်ငွေ</th><th>ပေါက်ဂဏန်းဖိုး</th><th>Commission ရငွေ</th><th>ပေးငွေ</th><th>စုစုပေါင်းငွေ</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.date)}</td><td>${r.session==='morning'?'မနက်':'ညနေ'}</td><td><b>${esc(r.number)}</b></td><td>${esc(r.userName)}</td><td>${fmt(r.total||0)} ကျပ်</td><td>${fmt(r.payout)} ကျပ် <small>(${fmt(r.winAmount)} × ${fmt(r.odd)})</small></td><td>${fmt(r.commission)} ကျပ်</td><td>${fmt(r.payment||0)} ကျပ်</td><td class="money">${fmt(r.net)} ကျပ်</td><td><button class="btn danger small" onclick="deleteFinalized('${r.id}')">ဖျက်</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">မှတ်တမ်းမရှိသေးပါ။ ထွက်ဂဏန်းထည့်ပြီး အပြီးစာရင်းချုပ်ပါ။</div>');
}
function openFinalizeConfirm(){
  const draws=sortDraws();
  if(!draws.length){modal(`<div class="close-row"><h3>အပြီးစာရင်းချုပ်မည်</h3><button class="close" onclick="closeModal()">×</button></div><div class="error" style="padding:14px">ထွက်ဂဏန်း မရှိသေးပါ။ အရင်ဆုံး ထွက်ဂဏန်းထည့်ပါ။</div><div class="formrow" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">OK</button></div>`);return}
  // the most recent draw (date + morning/evening) that has not been finalized yet
  const draw=draws.find(d=>!(db.finalizedRecords||[]).some(r=>r.date===d.date&&r.session===drawSess(d)));
  if(!draw){toast('ထွက်ဂဏန်းအားလုံးအတွက် အပြီးစာရင်းချုပ်ပြီးသားပါ');return}
  const sess=drawSess(draw);
  modal(`<div class="close-row"><div><h3>အပြီးစာရင်းချုပ်ရန်</h3><div class="sub">${esc(draw.date)} · ${sessLabel(sess)} · ထွက်ဂဏန်း ${esc(drawNum(draw))}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="hint">Commission User အားလုံး၏ တင်ငွေ၊ ပေါက်ဂဏန်းဖိုး (ပေါက်ဂဏန်းတင်ဖိုး × The Odd)၊ Commission၊ ပေးငွေနှင့် ပေးငွေနုတ်ပြီးနောက် စုစုပေါင်းငွေတို့ကို မှတ်တမ်းများထဲ သိမ်းပါမည်။</div><p style="font-weight:700">စာရင်းချုပ်မှာ သေချာပါသလား။</p><div class="formrow" style="justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">မလုပ်တော့ပါ</button><button class="btn" onclick="confirmFinalize('${draw.date}','${sess}')">OK</button></div>`);
}
function confirmFinalize(date,session){
  const draw=db.drawResults.find(x=>x.date===date&&drawSess(x)===session);if(!draw){toast('ထွက်ဂဏန်း မတွေ့ပါ');closeModal();return}
  const number=drawNum(draw).padStart(2,'0');
  db.finalizedRecords=db.finalizedRecords||[];
  if(db.finalizedRecords.some(r=>r.date===date&&r.session===session)){toast('ဒီအချိန်အတွက် စာရင်းချုပ်ပြီးသားပါ');closeModal();return}
  db.users.forEach(user=>{
   const lines=db.entries.filter(e=>e.userId===user.id&&e.date===date).flatMap(e=>e.lines||[]);
   const total=lines.reduce((a,x)=>a+Number(x.amount||0),0);
   const winAmount=lines.filter(x=>String(x.num).padStart(2,'0')===number).reduce((a,x)=>a+Number(x.amount||0),0);
   const odd=Number(user.odd??80),payout=winAmount*odd,commission=total*Number(user.commissionPercent||0)/100,payment=Number(user.payment||0),net=total-payout-commission-payment;
   db.finalizedRecords.push({id:'f'+Date.now()+Math.random().toString(36).slice(2,7),date,session,number,userId:user.id,userName:user.name,total,winAmount,odd,payout,commission,payment,net,created:new Date().toISOString()});
   // မှတ်တမ်းထဲ ပေးငွေကို သိမ်းပြီးနောက် နောက်စာရင်းအတွက် User ၏ ပေးငွေကို reset လုပ်ပါ
   user.payment=null;
  });
  // ယခုအချိန်အထိ ရှိသော ထိုနေ့၏ ဘောင်ချာများကို တင်စာရင်းမှ ဖယ်ရှားပါ (ညနေစာရင်းအတွက် နောက်မှထည့်သော ဘောင်ချာများ ဆက်ရှိမည်)
  db.entries=db.entries.filter(e=>e.date!==date);
  save();closeModal();render();showTab('history');toast('အပြီးစာရင်းချုပ်ပြီး ဘောင်ချာများကို တင်စာရင်းမှ ရှင်းလင်းပြီးပါပြီ');
}
function deleteFinalized(id){
  const r=(db.finalizedRecords||[]).find(x=>x.id===id);if(!r)return;
  modal(`<div class="close-row"><h3>မှတ်တမ်း ဖျက်မလား</h3><button class="close" onclick="closeModal()">×</button></div><div class="hint">${esc(r.date)} · ${sessLabel(r.session)} · ${esc(r.userName)} ၏ မှတ်တမ်းကို ဖျက်မည်။ ဖျက်ပြီးပါက ဘောင်ချာများ ပြန်မလာပါ။</div><div class="formrow" style="justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">မလုပ်တော့ပါ</button><button class="btn danger" onclick="confirmDeleteFinalized('${id}')">ဖျက်မယ်</button></div>`);
}
function confirmDeleteFinalized(id){
  db.finalizedRecords=(db.finalizedRecords||[]).filter(x=>x.id!==id);
  save();closeModal();render();toast('မှတ်တမ်းကို ဖျက်ပြီးပါပြီ');
}
function openDrawResults(){
  let today=new Date().toLocaleDateString('en-CA'),sess=defaultSession();
  let existing=db.drawResults.find(x=>x.date===today&&drawSess(x)===sess)||{};
  let history=sortDraws();
  modal(`<div class="close-row"><div><h3>ထွက်ဂဏန်း</h3><div class="sub">တစ်ရက်လျှင် မနက်တစ်ခု၊ ညနေတစ်ခု ထည့်နိုင်ပါသည်။ ၁:၀၀ PM မတိုင်မီ မနက်၊ ၁:၀၀ PM မှစ၍ ညနေဟု အလိုအလျောက် ရွေးပေးထားပါသည် (ပြင်ရွေးနိုင်သည်)။</div></div><button class="close" onclick="closeModal()">×</button></div><div class="formrow"><div class="field"><label>နေ့စွဲ</label><input id="drawDate" type="date" value="${today}" onchange="loadDrawDate()"></div><div class="field"><label>အချိန်</label><select id="drawSession" onchange="loadDrawDate()"><option value="morning"${sess==='morning'?' selected':''}>မနက်</option><option value="evening"${sess==='evening'?' selected':''}>ညနေ</option></select></div></div><div class="field"><label>ထွက်ဂဏန်း (00–99)</label><input id="drawNumber" inputmode="numeric" maxlength="2" placeholder="00–99" value="${esc(drawNum(existing))}" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,2)"></div><button class="btn" style="width:100%" onclick="saveDrawResults()">ထွက်ဂဏန်း သိမ်းမယ်</button><div class="preview" style="margin-top:16px"><b>သိမ်းထားသော ထွက်ဂဏန်းများ</b>${history.length?`<div class="table-wrap"><table style="min-width:0"><thead><tr><th>နေ့စွဲ</th><th>အချိန်</th><th>ထွက်ဂဏန်း</th><th></th></tr></thead><tbody>${history.map(x=>`<tr><td>${esc(x.date)}</td><td><b>${sessLabel(drawSess(x))}</b></td><td><b>${esc(drawNum(x))}</b></td><td><button class="btn danger small" onclick="deleteDrawResult('${x.date}','${drawSess(x)}')">ဖျက်</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">ရလဒ်မရှိသေးပါ</div>'}</div>`)
}
function loadDrawDate(){
  let d=document.getElementById('drawDate').value,sv=document.getElementById('drawSession').value,x=db.drawResults.find(r=>r.date===d&&drawSess(r)===sv)||{};
  document.getElementById('drawNumber').value=drawNum(x);
}
function saveDrawResults(){
  let date=document.getElementById('drawDate').value,session=document.getElementById('drawSession').value,number=document.getElementById('drawNumber').value.trim();
  if(!date||!/^\d{2}$/.test(number)){toast('နေ့စွဲနဲ့ ထွက်ဂဏန်းကို 00 မှ 99 အထိ ၂ လုံးထည့်ပါ');return}
  const now=new Date().toISOString();
  let item=db.drawResults.find(x=>x.date===date&&drawSess(x)===session);
  if(item){item.number=number;item.session=session;delete item.morning;delete item.evening;item.enteredAt=now}
  else db.drawResults.push({date,number,session,enteredAt:now});
  save();render();toast('ထွက်ဂဏန်း သိမ်းပြီးပါပြီ ('+sessLabel(session)+')');openDrawResultsForDate(date,session)
}
function openDrawResultsForDate(date,session){
  openDrawResults();document.getElementById('drawDate').value=date;
  if(session)document.getElementById('drawSession').value=session;
  loadDrawDate()
}
function deleteDrawResult(date,session){
  const x=db.drawResults.find(r=>r.date===date&&drawSess(r)===session);if(!x)return;
  modal(`<div class="close-row"><h3>ထွက်ဂဏန်း ဖျက်မလား</h3><button class="close" onclick="closeModal()">×</button></div><div class="hint">${esc(date)} · ${sessLabel(session)} · ထွက်ဂဏန်း ${esc(drawNum(x))} ကို ဖျက်မည်။ အပြီးစာရင်းချုပ်ပြီးသား မှတ်တမ်းများကို မထိခိုက်ပါ။</div><div class="formrow" style="justify-content:flex-end"><button class="btn ghost" onclick="openDrawResultsForDate('${date}','${session}')">မလုပ်တော့ပါ</button><button class="btn danger" onclick="confirmDeleteDraw('${date}','${session}')">ဖျက်မယ်</button></div>`);
}
function confirmDeleteDraw(date,session){
  db.drawResults=db.drawResults.filter(x=>!(x.date===date&&drawSess(x)===session));
  save();render();toast('ထွက်ဂဏန်းကို ဖျက်ပြီးပါပြီ');openDrawResultsForDate(date,session)
}
function modal(content){document.getElementById('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();showTab('users');
</script>
</body></html>
